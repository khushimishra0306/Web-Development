<!DOCTYPE html>
<html lang="en">
<head>

<title>Rock Paper Scissors</title>
</head>
<link rel="stylesheet" href="styles/RockPaperScissors.css">
<body>
  <p class="para">Rock Paper Scissors</p>

  
  <button class="move-button" Onclick="
  matching('rock');">
    <img src="images/rock-emoji.png" class="move-icon">
  </button>




 <button class="move-button"  Onclick=" matching('paper');"> 
   <img src="images/paper-emoji.png" class="move-icon">
 </button>


  
  <button class="move-button"  Onclick=" matching('scissors');">
    <img src="images/scissors-emoji.png" class="move-icon">
  </button>
  

  <p class="js-result result"></p>
  <p class="js-moves"></p>
  <p class="js-score scores"></p>

  <button class="reset" Onclick=" 
     score.wins=0;
     score.losses=0;
     score.ties=0;
     localStorage.removeItem('score');
    updateScore();">
    Reset score
  </button>

 
  
<script src="scripts/RockPaperScissors.js"></script>
</body>
</html>
