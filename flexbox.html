<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flexbox practice</title>
</head>
<body>
  <div style="
    display:flex;
    flex-direction:row;">
    <div style="background-color:lightblue;">
      div1 text
    </div>
    <div style="background-color:lightpink">div2 <p>text</p></div>
  </div>


   <div style="
     margin-top:30px;
    display:flex;
    flex-direction:row;">
    <div style="background-color:lightblue; width:100px;">
      div1
    </div>
    <div style="background-color:lightpink; flex:1;">div2 <p>text</p> </div>
  </div>



</div>

 <div style="
     margin-top:30px;
     display:flex;
     height:70px;
     border-width:1px;
     border-style:solid;
     border-color:grey;
     justify-content:center;
    flex-direction:row;">
    <div style="background-color:lightblue; width:100px;">
      div1
    </div>
    <div style="background-color:lightpink; width:100px;">div2</div>

     <div style="background-color:lightblue; width:100px;">div2 </div>

  </div>




  <div style="
     margin-top:30px;
     display:flex;
     height:70px;
     border-width:1px;
     border-style:solid;
     border-color:grey;
     justify-content:space-between;
    flex-direction:row;">
    <div style="background-color:lightblue; width:100px;">
      div1
    </div>
    <div style="background-color:lightpink; width:100px;">div2</div>

     <div style="background-color:lightblue; width:100px;">div2 </div>

  </div>



  <div style="
     margin-top:30px;
     display:flex;
     height:70px;
     border-width:1px;
     border-style:solid;
     border-color:grey;
     justify-content:space-between;
     align-items:center;
    flex-direction:row;">
    <div style="background-color:lightblue; width:100px;">
      div1
    </div>
    <div style="background-color:lightpink; width:100px;">div2</div>

     <div style="background-color:lightblue; width:100px;">div2 </div>

  </div>










</body>
</html>
