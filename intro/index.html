<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Layout Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Fixed Navigation Node Layer -->
    <header class="navbar">
        <div class="logo">DevNode Engine</div>
        <nav class="nav-links">
            <a href="#">Dashboard</a>
            <a href="#">Metrics</a>
            <a href="#">Logs</a>
        </nav>
    </header>

    <!-- 2. Flex Architecture Workspace Grid Layout -->
    <main class="content-wrapper">
        
        <!-- Interactive Card Unit 1 -->
        <article class="feature-card">
            <!-- Absolute position indicator badge node inside relative card element container -->
            <span class="badge-status">Active</span>
            <h3>FastAPI Core Pipeline</h3>
            <p>High-efficiency async execution array instances powering core data routing endpoints.</p>
        </article>

        <!-- Interactive Card Unit 2 -->
        <article class="feature-card">
            <span class="badge-status standby">Standby</span>
            <h3>React Node Cluster</h3>
            <p>Dynamic virtual DOM client interface engines parsing state payloads over WebSockets.</p>
        </article>

    </main>

</body>
</html>
