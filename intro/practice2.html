<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #ff7e5f, #feb47b);
      margin: 0;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      margin: 10px;
      border-radius: 9px ;
      border:solid darkorchid;
    box-shadow: 0 4px 6px rgba(0,0,0,0.9),
            0 8px 12px rgba(0,0,255,0.9);
    
      transition: transform 0.3s;
    }

    .box:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="box">This is a styled box</div>
  <div class="box">Hover me to see effect</div>
</body>
</html>
